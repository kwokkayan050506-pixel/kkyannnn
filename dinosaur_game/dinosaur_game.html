    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@700&display=swap" rel="stylesheet">

    <style>
    /* Style to make the svg fit in the browser */
    body { padding: 0; margin: 0; }
    svg  { width: 100%; height: auto; }

    /* The container moves the text to the middle of the screen */
    #gameover-container {
        transform: translate(500px,200px);  
        display: none;
    }
    #gameover {
        font-family: Dosis, sans-serif;
    }
@keyframes cloud-animation {
  from { transform: translateX(1100px);}
  to   { transform: translateX(-1100px); }
}

.cloud {
    animation-name: cloud-animation;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-duration: 8s;
    animation-play-state: running;
}
.cloud1 { animation-delay: -0.5s; }
.cloud2 { animation-delay: -2.5s; }
.cloud3 { animation-delay: -4.5s; }

@keyframes obstacle-animation {
  from { transform: translateX(1100px);}
  to   { transform: translateX(-1100px); }
}

#obstacle {
    animation-name: none;
    animation-timing-function: linear;
    animation-iteration-count: 1;
    animation-duration: 5s;
    display: none;
    animation-play-state: running;
}
@keyframes dinosaur-animation {
  0%   { transform: translateY(0px); }
  50%  { transform: translateY(-180px); }
  100% { transform: translateY(0px); }
}
#dinosaur {
    animation-name: none;
    animation-timing-function: linear;
    animation-iteration-count: 1;
    animation-duration: 1s;
}
    </style>
    <script>
    // Check whether the game is over if the dinosaur is near the obstacle
    function checkGameover() {
        const obstacleTransform = $("#obstacle").css("transform");
        const dinosaurTransform = $("#dinosaur").css("transform");
        let obstacle_x = null;
        let dinosaur_y = 0;
        if (obstacleTransform && obstacleTransform != "none")
            obstacle_x = parseFloat(obstacleTransform.split(",")[4]);
        if (dinosaurTransform && dinosaurTransform != "none")
            dinosaur_y = parseFloat(dinosaurTransform.split(",")[5]);
            // You need to keep on checking for the gameover situation here
        if(obstacle_x != null && $("#obstacle").css("display")!= "none"){
            const dinosaurOnGround = dinosaur_y > -30;
            const obstacleUnderDinosaur = obstacle_x < 150 && obstacle_x +60 > 50;
            if (dinosaurOnGround && obstacleUnderDinosaur) {
                console.log("Game over!");
            // Read the transform property of the dinosaur and obstacle
                $("#obstacle").css("animation-play-state", "paused");
                $(".cloud").css("animation-play-state", "paused");
                $("#dinosaur").css("animation-play-state", "paused");
                $("#gameover-container").fadeIn(800);
                return;
        // Extract the appropriate numbers
            }
        }
        // Compare the numbers for the gameover situation

        // Request to check again
        setTimeout(checkGameover, 50);
    }

    // Make an obstacle by starting the obstacle animation
    function makeObstacle() {

        // You need to show the obstacle and start the animation here]
        $("#obstacle").show();
        $("#obstacle").css("animation-name", "obstacle-animation");

    }

    // Make the dinosaur jump by starting the dinosaur animation
    function jump() {

        // You need to start the dinosaur jumping animation here
         $("#dinosaur").css("animation-name", "dinosaur-animation");
    }

    $(function () {
        // Handle the spacebar key for controlling the dinosaur
        $(document).on("keydown", function(e) {
            // The dinosaur jumps if the spacebar key is down
            if (e.keyCode == 32)
                jump();
        });
        let obstacleDuration = 5;
        // The obstacle animation has finished
        $("#obstacle").on("animationend", function() {

            // You need to hide the obstacle and stop the animation here
            $("#obstacle").hide();
            $("#obstacle").css("animation-name", "none");
            // You will make another obstacle later
            obstacleDuration = Math.max(1.5, obstacleDuration - 0.3);
            $("#obstacle").css("animation-duration", obstacleDuration + "s");
            setTimeout(makeObstacle, Math.random() * 2000);
        });

        // The dinosaur animation has finished
        $("#dinosaur").on("animationend", function() {

            // You need to stop the animation here
             $("#dinosaur").css("animation-name", "none");
        });

        // Start the obstacle animation
        setTimeout(makeObstacle, Math.random() * 2000);

        // Start the game over checking
        setTimeout(checkGameover, 50);
    });
    </script>
